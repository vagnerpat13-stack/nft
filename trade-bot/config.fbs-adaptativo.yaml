# FBS MetaTrader 5 — memória adaptativa + ema_rsi (GBPUSD 1h)
# Requisitos: Windows, terminal FBS MT5 aberto, .env com MT5_LOGIN / MT5_PASSWORD / MT5_SERVER
#
# Teste conexão:
#   python run.py mt5-test -c config.fbs-adaptativo.yaml
#
# Um ciclo:
#   python run.py -c config.fbs-adaptativo.yaml paper --once
#
# Contínuo:
#   python run.py -c config.fbs-adaptativo.yaml paper

broker: mt5
fonte_dados: mt5
estrategia: ema_rsi

symbol: GBPUSD
mt5_symbol: GBPUSD

paper_interval: 1h
mt5_barras: 500
paper_poll_segundos: 300
arquivo_estado: data/estado-fbs-adaptativo.json

# R:R 1:3 — ajuste pips no MT5 conforme seu lote (ver docs/FBS_METATRADER.md)
stop_loss_pct: 0.015
take_profit_pct: 0.045

capital_inicial: 10000.0
risco_por_operacao: 0.01
max_operacoes_dia: 5
drawdown_max_pct: 0.15

mt5_lote: 0.01
mt5_magic: 202609
mt5_desvio_pontos: 25
mt5_fechar_apenas_magic: true
mt5_comentario: trade-bot-adaptativo

ema_rapida: 9
ema_lenta: 21
rsi_periodo: 14
rsi_sobrecompra: 70
rsi_sobrevenda: 30

confianca_minima: 0.45
penalidade_erro: 0.12
bonus_acerto: 0.04
decaimento_memoria: 0.995

# Segunda opção (pullback 1% / 3%): descomente e comente ema_rsi acima
# estrategia: ema_pullback
# stop_loss_pct: 0.01
# take_profit_pct: 0.03
# pullback_rsi_min_long: 35
# pullback_rsi_max_long: 48
# pullback_rsi_min_short: 52
# pullback_rsi_max_short: 65
